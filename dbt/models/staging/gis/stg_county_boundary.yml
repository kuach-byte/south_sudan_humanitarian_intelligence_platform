# models/staging/gis/stg_county_boundary.yml
version: 2

models:
  - name: stg_county_boundary
    description: |
      Staging model for South Sudan county (admin level 2) boundary GIS data.
      Contains 79 counties with their spatial geometries, administrative codes,
      and parent state associations.
      
    config:
      schema: staging
      materialized: view
      tags: ['gis', 'staging', 'reference']
      
    columns:
      - name: county_code
        description: |
          Unique administrative code for the county (e.g., SS0101, SS0201).
          Primary key for county lookups.
        tests:
          - not_null
          - unique
          - dbt_utils.not_empty_string
          
      - name: county_name
        description: |
          Canonical county name from the reference name field.
          Preferred name for joining and display.
        tests:
          - not_null
          - dbt_utils.not_empty_string
          
      - name: county_name_alt
        description: |
          Alternative county name (adm2_name field).
          May contain slight variations; kept for QA purposes.
          
      - name: state_code
        description: |
          Parent state administrative code (e.g., SS01).
          Foreign key to stg_state_boundary.state_code.
        tests:
          - not_null
          - dbt_utils.not_empty_string
          - relationships:
              to: ref('stg_state_boundary')
              field: state_code
              arguments:
                severity: warn
              
      - name: state_name
        description: Parent state name from the county boundary table.
        tests:
          - not_null
          - dbt_utils.not_empty_string
          
      - name: country_code
        description: ISO country code (always 'SS' for South Sudan)
        tests:
          - not_null
          - accepted_values:
              values: ['SS']
              arguments:
                severity: warn
              
      - name: country_name
        description: Full country name ('South Sudan')
        tests:
          - not_null
          - accepted_values:
              values: ['South Sudan']
              arguments:
                severity: warn
              
      - name: geometry
        description: |
          Spatial geometry (polygon) representing the county boundary.
          Stored as GEOMETRY type for spatial operations.
        tests:
          - not_null
          - dbt_utils.not_empty_string
          
      - name: center_lat
        description: Latitude of the county's geographic center
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 15
              arguments:
                severity: warn
              
      - name: center_lon
        description: Longitude of the county's geographic center
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 20
              max_value: 40
              arguments:
                severity: warn
              
      - name: area_sqkm
        description: Area of the county in square kilometers
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 100
              max_value: 70000
              arguments:
                severity: warn
              
      - name: version
        description: Version of the GIS data (e.g., 'v03')
        
      - name: language
        description: Language code for the name fields (usually 'en')
        
      - name: valid_on
        description: Date when this boundary became effective
        
      - name: valid_to
        description: |
          Date when this boundary expires.
          NULL indicates currently valid boundary.
          
      - name: _staged_at
        description: |
          Timestamp when the record was staged.
          System-generated for audit purposes.
        tests:
          - not_null