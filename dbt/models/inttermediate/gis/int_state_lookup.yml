# models/intermediate/gis/int_state_lookup.yml
version: 2

models:
  - name: int_state_lookup
    description: |
      Authoritative state reference table derived from GIS boundaries.
      This is the single source of truth for state names across all datasets.
      
      Contains 10 states with their codes, names, and spatial metadata.
      
    config:
      schema: intermediate
      materialized: table
      tags: ['gis', 'reference', 'lookup']
      
    columns:
      - name: state_code
        description: |
          Unique administrative code for the state (e.g., SS01, SS02).
          Primary key for joining to facility and other datasets.
        tests:
          - not_null
          - unique
          - dbt_utils.not_empty_string
          
      - name: state_name
        description: |
          Canonical state name from the GIS reference name field.
          This is the authoritative name to use across all datasets.
        tests:
          - not_null
          - unique
          - dbt_utils.not_empty_string
          
      - name: country_code
        description: ISO country code (always 'SS' for South Sudan)
        tests:
          - not_null
          - accepted_values:
              values: ['SS']
              
      - name: country_name
        description: Full country name ('South Sudan')
        tests:
          - not_null
          - accepted_values:
              values: ['South Sudan']
              
      - name: geometry
        description: |
          Spatial geometry (polygon) representing the state boundary.
          Kept for potential spatial operations.
        tests:
          - not_null
          
      - name: center_lat
        description: Latitude of the state's geographic center
        tests:
          - not_null
          
      - name: center_lon
        description: Longitude of the state's geographic center
        tests:
          - not_null
          
      - name: version
        description: Version of the GIS data (e.g., 'v03')
        
      - name: valid_on
        description: Date when this boundary became effective
        
      - name: valid_to
        description: |
          Date when this boundary expires.
          NULL indicates currently valid boundary.
          
      - name: _staged_at
        description: Timestamp when the record was staged
        tests:
          - not_null