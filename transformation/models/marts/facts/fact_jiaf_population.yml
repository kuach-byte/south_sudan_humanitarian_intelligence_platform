version: 2
models:
  - name: fact_jiaf_population
    description: >
      Overall JIAF measures by reporting year, ADM2 location and population group (int_jiaf_2025 and
      int_jiaf_2026 combined with UNION ALL). Sector PiN values are in fact_jiaf_sector. The 2025 source has
      no severity, so severity is NULL for 2025. affected_population_projection comes from affected_population
      in 2025. NULL measures stay NULL.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [year, adm2_pcode, population_id]
    columns:
      - name: year
        data_tests:
          - not_null
          - accepted_values: {values: [2025, 2026], quote: false}
      - name: adm2_pcode
        data_tests:
          - not_null
          - relationships: {to: ref('dim_locations'), field: adm2_pcode, config: {severity: warn}}
      - name: population_id
        data_tests:
          - not_null
          - relationships: {to: ref('dim_population'), field: population_id}
      - name: affected_population_projection
      - name: final_pin
