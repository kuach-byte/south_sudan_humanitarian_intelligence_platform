version: 2
models:
  - name: stg_ssd_admin2
    description: >
      Staged South Sudan admin level 2 boundaries. Text trimmed (blank -> NULL); pcodes kept as text;
      area_sqkm, center_lat and center_lon are source-provided, not recomputed from the geometry.
      Spatial measurements downstream must use geography or a projected CRS, not 4326 geometry directly.
    meta:
      excluded_columns: {}
    columns:
      - name: adm2_name
        data_tests:
          - not_null
      - name: adm2_pcode
        data_tests:
          - not_null
          - unique
      - name: adm2_ref_name
      - name: adm1_name
      - name: adm1_pcode
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_ssd_admin1')
              field: adm1_pcode
              config:
                where: "adm1_pcode <> 'SS00'"

      - name: adm0_name
      - name: adm0_pcode
        data_tests:
          - not_null
      - name: valid_on
      - name: area_sqkm
      - name: center_lat
      - name: center_lon
      - name: version
      - name: lang
      - name: geometry
        description: >
          PostGIS geometry as loaded (not repaired, not reprojected). Expected type and SRID are asserted by
          tests/assert_staging_geometry_type_srid.sql; validity is warn-only in
          tests/assert_staging_geometry_validity.sql.
