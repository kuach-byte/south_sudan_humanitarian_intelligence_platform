version: 2
models:
  - name: stg_jiaf_south_sudan_2025
    description: >
      JIAF 2025 people in need (PiN) by admin 2 and population group. Raw columns carry a partly filled
      header row; the real header is the first data row, which this model drops and uses for renaming.
      CP = child protection, GBV = gender-based violence, HLP = housing, land and property,
      GP = general protection (abbreviation meanings assumed from the JIAF sectors).
    meta:
      excluded_columns: {}
    columns:
      - {name: adm1_name, meta: {source_column: Location}}
      - {name: adm1_pcode, meta: {source_column: unnamed_2}, data_tests: [not_null]}
      - {name: adm2_name, meta: {source_column: unnamed_3}}
      - name: adm2_pcode
        meta: {source_column: unnamed_4}
        data_tests:
          - not_null
          - relationships: {to: ref('stg_ssd_admin2'), field: adm2_pcode, config: {severity: warn}}
      - {name: affected_population, meta: {source_column: Populaton}}
      - {name: population_group, meta: {source_column: unnamed_6}, data_tests: [not_null]}
      - {name: pin_cccm, meta: {source_column: "Sectoral PiN (Number)"}}
      - {name: pin_education, meta: {source_column: unnamed_8}}
      - {name: pin_nutrition, meta: {source_column: unnamed_9}}
      - {name: pin_food_security, meta: {source_column: unnamed_10}}
      - {name: pin_health, meta: {source_column: unnamed_11}}
      - {name: pin_overarching_protection, meta: {source_column: unnamed_12}}
      - {name: pin_shelter, meta: {source_column: unnamed_13}}
      - {name: pin_wash, meta: {source_column: unnamed_14}}
      - {name: pin_cp, meta: {source_column: "Protection AoRs"}}
      - {name: pin_gbv, meta: {source_column: unnamed_16}}
      - {name: pin_mine_action, meta: {source_column: unnamed_17}}
      - {name: pin_hlp, meta: {source_column: unnamed_18}}
      - {name: pin_gp, meta: {source_column: unnamed_19}}
      - {name: preliminary_pin, meta: {source_column: unnamed_20}}
      - {name: final_pin, meta: {source_column: unnamed_21}, data_tests: [not_null]}
